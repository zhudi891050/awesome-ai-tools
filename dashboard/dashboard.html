<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新方舟AI · GEO指挥面板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-hover: #334155;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.3);
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --border: #334155;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
.header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 20px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .time { color: var(--text-dim); font-size: 13px; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: all 0.2s; }
.card:hover { border-color: var(--accent); box-shadow: 0 4px 20px var(--accent-glow); }
.card .label { color: var(--text-dim); font-size: 13px; margin-bottom: 8px; }
.card .value { font-size: 36px; font-weight: 700; }
.card .change { font-size: 13px; margin-top: 4px; }
.card .change.up { color: var(--success); }
.card .change.down { color: var(--danger); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.chart-card h3 { font-size: 15px; margin-bottom: 16px; color: var(--text-dim); }
.chart-container { position: relative; height: 300px; }
.table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
.table-card h3 { font-size: 15px; margin-bottom: 12px; color: var(--text-dim); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--text-dim); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.5px; }
td { padding: 12px; font-size: 14px; border-bottom: 1px solid var(--border); }
tr:hover td { background: var(--bg-hover); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
.badge-success { background: rgba(34,197,94,0.2); color: var(--success); }
.badge-fail { background: rgba(239,68,68,0.2); color: var(--danger); }
.badge-pending { background: rgba(245,158,11,0.2); color: var(--warning); }
.footer { text-align: center; color: var(--text-dim); font-size: 12px; padding: 24px; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.loading { animation: pulse 2s infinite; }
@media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- 头部 -->
<header class="header">
  <h1>🚀 新方舟AI · GEO指挥面板</h1>
  <span class="time" id="current-time"></span>
</header>

<div class="container">
  <!-- 概览卡片 -->
  <div class="cards">
    <div class="card">
      <div class="label">🎯 今日AI可见度得分</div>
      <div class="value loading" id="today-score">--</div>
      <div class="change" id="score-change">--</div>
    </div>
    <div class="card">
      <div class="label">📊 品牌提及率（30天）</div>
      <div class="value loading" id="mention-rate">--</div>
      <div class="change">所有AI引擎综合</div>
    </div>
    <div class="card">
      <div class="label">📝 已发布内容</div>
      <div class="value loading" id="content-count">--</div>
      <div class="change">累计GEO优化内容</div>
    </div>
    <div class="card">
      <div class="label">🔍 今日查询次数</div>
      <div class="value loading" id="today-queries">--</div>
      <div class="change">覆盖多个AI引擎</div>
    </div>
  </div>

  <!-- 图表区 -->
  <div class="grid-2">
    <div class="chart-card">
      <h3>📈 AI可见度趋势（30天）</h3>
      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>🤖 各引擎得分对比（7天）</h3>
      <div class="chart-container">
        <canvas id="engineChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 最近提及 -->
  <div class="table-card">
    <h3>📋 最近AI提及记录</h3>
    <table>
      <thead>
        <tr><th>时间</th><th>引擎</th><th>查询</th><th>提及</th><th>得分</th><th>上下文</th></tr>
      </thead>
      <tbody id="mentions-table"></tbody>
    </table>
  </div>

  <!-- 发布日志 -->
  <div class="table-card">
    <h3>🚀 最近发布日志</h3>
    <table>
      <thead>
        <tr><th>时间</th><th>平台</th><th>标题</th><th>状态</th></tr>
      </thead>
      <tbody id="publish-table"></tbody>
    </table>
  </div>
</div>

<footer class="footer">新方舟AI · GEO智能铺量追踪系统 · 自动刷新</footer>

<script>
// 更新时钟
function updateClock() {
  const now = new Date();
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('current-time').textContent =
    now.toLocaleDateString('zh-CN') + ' ' + days[now.getDay()] + ' ' +
    now.toLocaleTimeString('zh-CN');
}
updateClock();
setInterval(updateClock, 30000);

// 图表实例
let trendChart = null;
let engineChart = null;

// 加载总览数据
async function loadOverview() {
  try {
    const resp = await fetch('/api/dashboard/overview');
    const data = await resp.json();
    document.getElementById('today-score').textContent = data.today_score;
    document.getElementById('today-score').classList.remove('loading');
    const change = document.getElementById('score-change');
    if (data.score_change > 0) {
      change.className = 'change up';
      change.textContent = '↑' + data.score_change + ' vs 昨日';
    } else if (data.score_change < 0) {
      change.className = 'change down';
      change.textContent = '↓' + Math.abs(data.score_change) + ' vs 昨日';
    } else {
      change.className = 'change';
      change.textContent = '持平 vs 昨日';
    }
    document.getElementById('mention-rate').textContent = data.mention_rate_30d + '%';
    document.getElementById('mention-rate').classList.remove('loading');
    document.getElementById('content-count').textContent = data.content_count;
    document.getElementById('content-count').classList.remove('loading');
    document.getElementById('today-queries').textContent = data.total_queries_today;
    document.getElementById('today-queries').classList.remove('loading');
  } catch(e) { console.error('Overview load error:', e); }
}

// 加载趋势图
async function loadTrend() {
  try {
    const resp = await fetch('/api/dashboard/trend?days=30');
    const data = await resp.json();
    const labels = data.trend.map(t => t.date.slice(5));
    const scores = data.trend.map(t => t.score);

    if (trendChart) trendChart.destroy();
    const ctx = document.getElementById('trendChart').getContext('2d');
    trendChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'AI可见度得分',
          data: scores,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 2,
          pointHoverRadius: 5,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#94a3b8', maxTicksLimit: 10 }, grid: { color: '#334155' } },
          y: { min: 0, max: 100, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
        }
      }
    });
  } catch(e) { console.error('Trend load error:', e); }
}

// 加载引擎对比图
async function loadEngines() {
  try {
    const resp = await fetch('/api/dashboard/engines');
    const data = await resp.json();
    const labels = data.engines.map(e => e.name);
    const scores = data.engines.map(e => e.avg_score);
    const mentions = data.engines.map(e => e.mentions);
    const colors = ['#3b82f6','#8b5cf6','#22c55e','#f59e0b','#ef4444','#ec4899'];

    if (engineChart) engineChart.destroy();
    const ctx = document.getElementById('engineChart').getContext('2d');
    engineChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '平均得分',
          data: scores,
          backgroundColor: colors.slice(0, labels.length),
          borderRadius: 6,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
          y: { min: 0, max: 100, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
        }
      }
    });
  } catch(e) { console.error('Engine load error:', e); }
}

// 加载最近提及
async function loadMentions() {
  try {
    const resp = await fetch('/api/dashboard/recent-mentions?limit=10');
    const data = await resp.json();
    const tbody = document.getElementById('mentions-table');
    tbody.innerHTML = data.mentions.map(m => `
      <tr>
        <td style="color:var(--text-dim);font-size:12px">${m.time?.slice(0,16) || ''}</td>
        <td>${m.engine}</td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.query}</td>
        <td>${m.mentioned ? '<span class="badge badge-success">✅ 已提及</span>' : '<span class="badge badge-fail">❌ 未提及</span>'}</td>
        <td><strong>${m.score}</strong></td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.context || '-'}</td>
      </tr>
    `).join('');
    if (!data.mentions.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-dim)">暂无数据，开始每日追踪后将显示记录</td></tr>';
    }
  } catch(e) { console.error('Mentions load error:', e); }
}

// 加载发布日志
async function loadPublishLog() {
  try {
    const resp = await fetch('/api/dashboard/publish-log?limit=10');
    const data = await resp.json();
    const tbody = document.getElementById('publish-table');
    tbody.innerHTML = data.logs.map(l => {
      let badge = '';
      if (l.status === 'success') badge = '<span class="badge badge-success">✅ 成功</span>';
      else if (l.status === 'failed') badge = '<span class="badge badge-fail">❌ 失败</span>';
      else badge = '<span class="badge badge-pending">⏳ 待发布</span>';
      return `
        <tr>
          <td style="color:var(--text-dim);font-size:12px">${l.time?.slice(0,16) || ''}</td>
          <td>${l.platform}</td>
          <td>${l.title}</td>
          <td>${badge}</td>
        </tr>
      `;
    }).join('');
    if (!data.logs.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-dim)">暂无发布记录</td></tr>';
    }
  } catch(e) { console.error('Publish log error:', e); }
}

// 初始化
async function init() {
  await Promise.all([
    loadOverview(),
    loadTrend(),
    loadEngines(),
    loadMentions(),
    loadPublishLog()
  ]);
}

// 30秒自动刷新（数据部分）
init();
setInterval(() => {
  loadOverview();
  loadMentions();
  loadPublishLog();
}, 30000);

// 5分钟刷新图表
setInterval(() => {
  loadTrend();
  loadEngines();
}, 300000);
</script>
</body>
</html>
